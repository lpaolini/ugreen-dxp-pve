name: Publish Debian repository

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 0.4.0"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils \
            build-essential \
            debhelper \
            dh-dkms \
            dkms \
            dpkg-dev \
            fakeroot \
            gnupg \
            lintian \
            shellcheck

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            version="${version#v}"
          elif [[ "${GITHUB_REF_TYPE}" = "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0+${GITHUB_SHA::12}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build Debian packages
        run: ./packaging/build-all.sh "${{ steps.version.outputs.version }}" dist

      - name: Run package checks
        run: |
          shellcheck \
            packaging/build-all.sh \
            packaging/build-repository.sh \
            packages/leds-dkms/debian/probe-led-ugreen \
            packages/leds-dkms/debian/configure-led-ugreen \
            packages/leds-dkms/debian/ugreen-dxp-pve-leds-dkms.postinst \
            packages/leds-dkms/debian/ugreen-dxp-pve-leds-dkms.prerm \
            packages/leds-dkms/debian/ugreen-dxp-pve-leds-dkms.postrm \
            packages/truenas/packaging/build-deb.sh
          lintian --profile debian -EvIL +pedantic dist/*.deb

      - name: Upload Debian package artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ugreen-dxp-pve_${{ steps.version.outputs.version }}_debs
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload Debian packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true

      - name: Build APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          REQUIRE_APT_SIGNING: "1"
        run: |
          ./packaging/build-repository.sh \
            dist \
            public \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
