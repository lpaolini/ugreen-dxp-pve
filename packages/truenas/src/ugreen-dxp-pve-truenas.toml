# Configuration for ugreen-truenas-fan.service and ugreen-truenas-zfs.service.
#
# Apply changes with:
#   systemctl restart ugreen-truenas-fan.service ugreen-truenas-zfs.service

# Proxmox VM ID of the TrueNAS Scale VM.
vmid = 100

# Log every poll in detail.
debug = false

[fan]
# Seconds between polls.
poll_interval = 30
# Fan speed limits (PWM 0-255), for noise control.
min_pwm = 90
max_pwm = 255
# PWM used when temperatures cannot be read, e.g. while TrueNAS is stopped.
failsafe_pwm = 255
# The fan header the case fan is wired to: pwmN of the it87 chip (usually 2 or 3).
pwm_channel = 3

# The fan follows whichever of the hottest disk and the host CPU asks for more.
[disk]
# The fan stays at min_pwm up to target_temperature (°C) and speeds up by
# `ramp` PWM for every °C above it, up to max_pwm.
target_temperature = 35
ramp = 17
# The power LED turns orange when the hottest disk reaches warning_temperature
# (°C); at alert_temperature it turns red and the fan runs at max_pwm.
warning_temperature = 40
alert_temperature = 43

[cpu]
# As in [disk], for the host CPU.
target_temperature = 45
ramp = 3

[zfs]
# Seconds between polls.
poll_interval = 30
# A healthy disk in a pool at least this full shows ONLINE_ALERT.
alert_threshold = 0.75
# The disk path inside TrueNAS of each bay, bay 1 first; bay N drives LED diskN.
# These match the DXP4800 PRO backplane: check with `ls -l /dev/disk/by-path/`
# inside TrueNAS.
bays = ["/dev/disk/by-path/pci-0000:00:10.0-ata-1", "/dev/disk/by-path/pci-0000:00:10.0-ata-2", "/dev/disk/by-path/pci-0000:00:10.0-ata-3", "/dev/disk/by-path/pci-0000:00:10.0-ata-4"]

# LED looks. Colours are "#rrggbb"; effects are "none", "blink:ON:OFF" or
# "breath:ON:OFF" (milliseconds). Among all services publishing for an LED,
# the lowest priority wins.

# The power LED while the fan cannot be controlled.
[power.FAULT]
priority = 10
color = "#ff0000"
effect = "blink:500:500"

# The power LED while the hottest disk is at or above [disk] alert_temperature.
[power.TEMP_ALERT]
priority = 20
color = "#ff0000"

# The power LED while the hottest disk is at or above [disk] warning_temperature.
[power.TEMP_WARNING]
priority = 30
color = "#ff8000"

# Disk LEDs, most severe first.
[disk.FAULTED]
priority = 10
color = "#500000"
effect = "blink:500:500"

# TrueNAS could not be queried or its answer parsed.
[disk.ERROR]
priority = 15
color = "#500000"

[disk.UNAVAIL]
priority = 20
color = "#500000"
effect = "blink:500:500"

[disk.REMOVED]
priority = 25
color = "#500000"
effect = "blink:500:500"

# A pool member that is in no bay.
[disk.MISSING]
priority = 30
color = "#280028"
effect = "blink:500:500"

[disk.DEGRADED]
priority = 35
color = "#502800"
effect = "blink:500:500"

[disk.RESILVER]
priority = 40
color = "#505050"
effect = "blink:500:500"

[disk.OFFLINE]
priority = 45
color = "#500000"
effect = "blink:500:500"

# Shown while TrueNAS is queried. The bay keeps its current colour; this
# colour is used only for a bay that has shown nothing yet.
[disk.CHECKING]
priority = 50
color = "#282828"
effect = "blink:100:100"

[disk.ONLINE_ALERT]
priority = 60
color = "#002800"
effect = "blink:500:500"

[disk.SPINDOWN]
priority = 65
color = "#002800"
effect = "breath:2000:0"

[disk.ONLINE]
priority = 70
color = "#002800"

# An empty bay.
[disk.OFF]
priority = 90
color = "#000000"
