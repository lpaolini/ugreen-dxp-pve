# Package defaults for ugreen-dxp-pve-leds.service. Do not edit: this file is
# replaced on upgrade. Override any key in /etc/ugreen-dxp-pve-leds.toml.
#
# [leds.<name>]  one front-panel LED. Producers publish states for it as
#                /run/ugreen-dxp-pve/<producer>/<name>; with none, `default` applies.
# [states.<NAME>] one look. `priority` picks between producers (highest wins).
#                Every other key is written to the LED's sysfs attribute of the
#                same name: `trigger` first, then in the order listed here.
#                Keys left out leave that attribute untouched.

[bind]
# i2c_bus = 1    # force the I2C bus; default: auto-detect "SMBus I801 adapter".
                 # Bus numbers can change between boots: pin only if detection fails.

[leds.power]
path = "/sys/class/leds/ugreen:white:power"
default = "NORMAL"

[leds.netdev]
path = "/sys/class/leds/ugreen:white:netdev"
default = "NETDEV"

[leds.disk1]
path = "/sys/class/leds/ugreen:white:disk1"
default = "OFF"

[leds.disk2]
path = "/sys/class/leds/ugreen:white:disk2"
default = "OFF"

[leds.disk3]
path = "/sys/class/leds/ugreen:white:disk3"
default = "OFF"

[leds.disk4]
path = "/sys/class/leds/ugreen:white:disk4"
default = "OFF"

[leds.disk5]
path = "/sys/class/leds/ugreen:white:disk5"
default = "OFF"

[leds.disk6]
path = "/sys/class/leds/ugreen:white:disk6"
default = "OFF"

[leds.disk7]
path = "/sys/class/leds/ugreen:white:disk7"
default = "OFF"

[leds.disk8]
path = "/sys/class/leds/ugreen:white:disk8"
default = "OFF"

# Power LED

[states.NORMAL]
priority = 0
trigger = "none"
blink_type = "none"
brightness = 255
color = "0 64 16"

[states.FAULT]
priority = 100
trigger = "none"
brightness = 255
color = "255 0 0"
blink_type = "blink 500 500"

# Network LED

[states.NETDEV]
priority = 0
trigger = "netdev"
device_name = "vmbr0"
brightness = 255
color = "0 64 255"
link = 1
tx = 1
rx = 1
interval = 50

# Disk LEDs (published by ugreen-truenas-zfs.service). `trigger = "none"`
# drops the driver's default oneshot trigger.

[states.OFF]
priority = 0
trigger = "none"
color = "0 0 0"
blink_type = "none"
brightness = 1

[states.ONLINE]
priority = 10
trigger = "none"
color = "0 40 0"
blink_type = "none"
brightness = 255

[states.SPINDOWN]
priority = 11
trigger = "none"
color = "0 40 0"
blink_type = "breath 2000 0"
brightness = 255

[states.ONLINE_ALERT]
priority = 20
trigger = "none"
color = "0 40 0"
blink_type = "blink 500 500"
brightness = 255

[states.CHECKING]
priority = 25
trigger = "none"
blink_type = "blink 100 100"

[states.OFFLINE]
priority = 30
trigger = "none"
color = "80 0 0"
blink_type = "blink 500 500"
brightness = 255

[states.RESILVER]
priority = 35
trigger = "none"
color = "80 80 80"
blink_type = "blink 500 500"
brightness = 255

[states.DEGRADED]
priority = 40
trigger = "none"
color = "80 40 0"
blink_type = "blink 500 500"
brightness = 255

[states.MISSING]
priority = 45
trigger = "none"
color = "40 0 40"
blink_type = "blink 500 500"
brightness = 255

[states.REMOVED]
priority = 50
trigger = "none"
color = "80 0 0"
blink_type = "blink 500 500"
brightness = 255

[states.UNAVAIL]
priority = 60
trigger = "none"
color = "80 0 0"
blink_type = "blink 500 500"
brightness = 255

[states.ERROR]
priority = 65
trigger = "none"
color = "80 0 0"
blink_type = "none"
brightness = 255

[states.FAULTED]
priority = 70
trigger = "none"
color = "80 0 0"
blink_type = "blink 500 500"
brightness = 255
